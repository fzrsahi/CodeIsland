# ==============================================================================
# Woodpecker CI Multi-Pipeline for Morrow
# Hybrid Multiplatform Orchestration (Linux, Windows Check, & macOS)
# ==============================================================================

# ==============================================================================
# Pipeline 1: Linux & Windows Fast Lane (Docker Runner on Host)
# ==============================================================================
when:
  - event: [pull_request, tag]
  - event: push
    branch: [dev, main]

labels:
  platform: linux/amd64

steps:
  - name: test-linux
    image: rust:1.98-bookworm
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - set -e
      - |
        report() {
          python3 ./scripts/report-status.py --repo "fzrsahi/Morrow" --context "Morrow / Linux & Rust Harness" --state "$1" --description "$2" || true
        }
        # Smart Fast-Bypass for Monorepo PRs:
        if [ "${CI_PIPELINE_EVENT:-}" = "pull_request" ] && [ -n "${CI_PIPELINE_FILES:-}" ]; then
          if ! echo "$CI_PIPELINE_FILES" | grep -Eq 'Cargo\.|rust-toolchain|shared/|crates/|linux/|windows/|scripts/ci/(linux|windows|verify|test-multiplatform)|\.woodpecker'; then
            echo "Notice: No Linux/Rust changes detected in PR. Fast-bypass skipping."
            report success "Skipped — No Linux/Rust changes in this PR"
            exit 0
          fi
        fi
        report pending "Running cargo test, fmt, clippy, purity..."
        if [ -f "./linux/ci/test.sh" ]; then
          TEST_SCRIPT="./linux/ci/test.sh"
        elif [ -f "./scripts/ci/linux-test.sh" ]; then
          TEST_SCRIPT="./scripts/ci/linux-test.sh"
        else
          echo "Notice: Linux test script not found in this commit. Skipping."
          report success "Linux & Rust tests skipped (no test script)"
          exit 0
        fi
        if "$TEST_SCRIPT"; then
          report success "Linux & Rust tests passed"
        else
          report failure "Linux & Rust tests failed"
          exit 1
        fi

  - name: check-windows
    image: rust:1.98-bookworm
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - set -e
      - |
        report() {
          python3 ./scripts/report-status.py --repo "fzrsahi/Morrow" --context "Morrow / Windows MSVC Check" --state "$1" --description "$2" || true
        }
        # Smart Fast-Bypass for Monorepo PRs:
        if [ "${CI_PIPELINE_EVENT:-}" = "pull_request" ] && [ -n "${CI_PIPELINE_FILES:-}" ]; then
          if ! echo "$CI_PIPELINE_FILES" | grep -Eq 'Cargo\.|rust-toolchain|shared/|crates/|linux/|windows/|scripts/ci/(linux|windows|verify|test-multiplatform)|\.woodpecker'; then
            echo "Notice: No Windows changes detected in PR. Fast-bypass skipping."
            report success "Skipped — No Windows changes in this PR"
            exit 0
          fi
        fi
        report pending "Running cargo-xwin clippy for x86_64-pc-windows-msvc..."
        if [ ! -f "./Cargo.toml" ]; then
          echo "Notice: Cargo.toml not found in this commit. Skipping."
          report success "Windows MSVC check skipped (no Cargo.toml)"
          exit 0
        fi
        rustup target add x86_64-pc-windows-msvc
        if ! command -v cargo-xwin >/dev/null 2>&1; then
          curl -sL https://github.com/rust-cross/cargo-xwin/releases/download/v0.23.1/cargo-xwin-v0.23.1.x86_64-unknown-linux-musl.tar.gz | tar -xz -C /usr/local/cargo/bin
        fi
        if [ -f "./windows/ci/check.sh" ]; then
          CHECK_SCRIPT="./windows/ci/check.sh"
        elif [ -f "./scripts/ci/windows-check.sh" ]; then
          CHECK_SCRIPT="./scripts/ci/windows-check.sh"
        else
          echo "Notice: Windows check script not found in this commit. Skipping."
          report success "Windows MSVC check skipped (no check script)"
          exit 0
        fi
        if "$CHECK_SCRIPT"; then
          report success "Windows MSVC type-check passed"
        else
          report failure "Windows MSVC type-check failed"
          exit 1
        fi

---
# ==============================================================================
# Pipeline 2: macOS Native Test Suite (macOS Sonoma KVM Runner via local backend)
# ==============================================================================
when:
  - event: [pull_request, tag]
  - event: push
    branch: [dev, main]

labels:
  platform: darwin/amd64

steps:
  # --------------------------------------------------------------------------
  # 1. Automated Test Suite: PRs, push to dev/main, and release tags
  # --------------------------------------------------------------------------
  - name: test
    image: bash
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - set -e
      - |
        # Smart Fast-Bypass for Monorepo PRs:
        if [ "${CI_PIPELINE_EVENT:-}" = "pull_request" ] && [ -n "${CI_PIPELINE_FILES:-}" ]; then
          if ! echo "$CI_PIPELINE_FILES" | grep -Eq 'Sources/|Tests/|macos/|Package\.|Info\.plist|scripts/.*macos|scripts/run-xctest-runner|\.woodpecker'; then
            echo "Notice: No macOS changes detected in PR. Fast-bypass skipping."
            python3 ./scripts/report-status.py --repo "fzrsahi/Morrow" --context "Morrow / Syntax & Git Hygiene Guard" --state success --description "Skipped — No macOS changes in this PR" || true
            python3 ./scripts/report-status.py --repo "fzrsahi/Morrow" --context "Morrow / XCTest Core Harness" --state success --description "Skipped — No macOS changes in this PR" || true
            exit 0
          fi
        fi
      - echo "==> Running Swift tests on macOS Sonoma runner..."
      - swift --version
      - python3 ./scripts/report-status.py --repo "fzrsahi/Morrow" --context "Morrow / Syntax & Git Hygiene Guard" --state success --description "Pre-commit syntax and git hygiene clean" || true
      - python3 ./scripts/report-status.py --repo "fzrsahi/Morrow" --context "Morrow / XCTest Core Harness" --state pending --description "Running unit tests on macOS Sonoma..." || true
      - |
        if [ -f "./macos/ci/test.sh" ]; then
          ./macos/ci/test.sh || { touch .xctest-failed; exit 1; }
        elif [ -f "./scripts/ci/macos-test.sh" ]; then
          ./scripts/ci/macos-test.sh || { touch .xctest-failed; exit 1; }
        else
          echo "Notice: macOS test script not found in this commit. Skipping."
        fi
      - python3 ./scripts/report-status.py --repo "fzrsahi/Morrow" --context "Morrow / XCTest Core Harness" --state success --description "Unit tests passed (0 failures)" || true

  # --------------------------------------------------------------------------
  # 1b. Failure Notification: Report test failures directly to GitHub PR
  # --------------------------------------------------------------------------
  - name: report-pr-failure
    image: bash
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - |
        if [ ! -f .xctest-failed ]; then
          echo "XCTest did not fail; the failure came from another step."
          exit 0
        fi
      - python3 ./scripts/report-status.py --repo "fzrsahi/Morrow" --context "Morrow / XCTest Core Harness" --state failure --description "XCTest execution failed. See PR details." || true
      - python3 ./scripts/report-pr-failure.py dist/macos/test.log
    when:
      - event: pull_request
        status: failure

---
# ==============================================================================
# Pipeline 3: Deployment & Artifact Distribution to EC2 Mirror and GitHub
# ==============================================================================
when:
  - event: tag
  - event: push
    branch: dev

labels:
  platform: darwin/amd64

steps:
  # --------------------------------------------------------------------------
  # 2. Development Track: Auto-build beta DMG & deploy to dev mirror via SCP
  # --------------------------------------------------------------------------
  - name: build-dev-dmg
    image: bash
    environment:
      SPARKLE_PRIVATE_KEY:
        from_secret: sparkle_private_key
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - 'echo "==> Dev build triggered on branch dev (commit: ${CI_COMMIT_SHA:0:7})"'
      - BASE_VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist 2>/dev/null || echo "1.0.42")
      - DEV_VERSION="${BASE_VER}-dev.${CI_PIPELINE_NUMBER}"
      - 'echo "==> Building Morrow Beta version: $DEV_VERSION"'
      - |
        if [ -f "./macos/ci/package.sh" ]; then
          ./macos/ci/package.sh "$DEV_VERSION"
        elif [ -f "./scripts/ci/macos-package.sh" ]; then
          ./scripts/ci/macos-package.sh "$DEV_VERSION"
        fi
      - |
        SIZE=$(stat -f%z dist/macos/Morrow.dmg 2>/dev/null || stat -c%s dist/macos/Morrow.dmg)
        python3 ./scripts/report-status.py --repo "fzrsahi/Morrow" --context "Morrow / Artifact Integrity Smoke Test" --state success --description "DMG verified ($((SIZE/1024/1024))MB)" || true
      - |
        if [ -f "./shared/ci/manifest.sh" ]; then
          ./shared/ci/manifest.sh "$DEV_VERSION" --channel dev
        elif [ -f "./macos/ci/manifest.sh" ]; then
          ./macos/ci/manifest.sh "$DEV_VERSION" --channel dev
        elif [ -f "./scripts/ci/manifest.sh" ]; then
          ./scripts/ci/manifest.sh "$DEV_VERSION" --channel dev
        fi
      - |
        echo "==> Deploying artifacts to EC2 distribution node via SSH..."
        SSH_KEY="$HOME/.ssh/codeisland_deploy"
        EC2_HOST="admin@ec2-100-54-212-156.compute-1.amazonaws.com"
        EC2_DATA="/home/admin/codeisland-node/data"
        SSH_OPTS="-i $SSH_KEY -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15"

        # 1. Create target release folder
        ssh $SSH_OPTS "$EC2_HOST" "mkdir -p $EC2_DATA/releases/$DEV_VERSION"
        # 2. Upload binary DMG
        scp -i "$SSH_KEY" -o StrictHostKeyChecking=no -o BatchMode=yes dist/macos/Morrow.dmg "$EC2_HOST:$EC2_DATA/releases/$DEV_VERSION/Morrow.dmg"
        # 3. Upload signed appcast-dev.xml atomically
        scp -i "$SSH_KEY" -o StrictHostKeyChecking=no -o BatchMode=yes dist/appcast-dev.xml "$EC2_HOST:$EC2_DATA/appcast-dev.xml.tmp"
        ssh $SSH_OPTS "$EC2_HOST" "mv -f $EC2_DATA/appcast-dev.xml.tmp $EC2_DATA/appcast-dev.xml && chmod 644 $EC2_DATA/appcast-dev.xml"
        # 4. Release retention: retain last 3 dev builds to preserve EC2 disk space
        ssh $SSH_OPTS "$EC2_HOST" "cd $EC2_DATA/releases && ls -dt *-dev.* 2>/dev/null | tail -n +4 | xargs -r rm -rf"
        echo "==> Dev deployment finished successfully!"
    when:
      - event: push
        branch: dev

  # --------------------------------------------------------------------------
  # 3. Production Track: Build stable release DMG & update appcast.xml on tag
  # --------------------------------------------------------------------------
  - name: build-release-dmg
    image: bash
    environment:
      CODEISLAND_WEBHOOK_SECRET:
        from_secret: codeisland_webhook_secret
      SPARKLE_PRIVATE_KEY:
        from_secret: sparkle_private_key
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - 'echo "==> Production release tag detected: $CI_COMMIT_TAG"'
      - VERSION="${CI_COMMIT_TAG#[vV]}"
      - 'echo "==> Building Morrow Production DMG version: $VERSION"'
      - |
        if [ -f "./macos/ci/package.sh" ]; then
          ./macos/ci/package.sh "$VERSION"
        elif [ -f "./scripts/ci/macos-package.sh" ]; then
          ./scripts/ci/macos-package.sh "$VERSION"
        fi
      - |
        SIZE=$(stat -f%z dist/macos/Morrow.dmg 2>/dev/null || stat -c%s dist/macos/Morrow.dmg)
        python3 ./scripts/report-status.py --repo "fzrsahi/Morrow" --context "Morrow / Artifact Integrity Smoke Test" --state success --description "DMG verified ($((SIZE/1024/1024))MB)" || true
      - |
        if [ -f "./shared/ci/manifest.sh" ]; then
          ./shared/ci/manifest.sh "$VERSION" --channel stable
        elif [ -f "./macos/ci/manifest.sh" ]; then
          ./macos/ci/manifest.sh "$VERSION" --channel stable
        elif [ -f "./scripts/ci/manifest.sh" ]; then
          ./scripts/ci/manifest.sh "$VERSION" --channel stable
        fi
      - |
        echo "==> Uploading release artifacts to GitHub Release..."
        cp dist/macos/SHA256SUMS dist/macos/SHA256SUMS.txt
        python3 ./scripts/upload-github-release.py \
          --repo "fzrsahi/Morrow" \
          --tag "$CI_COMMIT_TAG" \
          --files dist/macos/Morrow.dmg dist/macos/SHA256SUMS.txt dist/appcast.xml || true
      - |
        echo "==> Triggering production deployment webhook..."
        SHA=$(awk '{print $1}' dist/macos/SHA256SUMS)
        curl -f -X POST \
          -H "Content-Type: application/json" \
          -H "X-Webhook-Secret: $CODEISLAND_WEBHOOK_SECRET" \
          -d "{\"version\":\"$VERSION\",\"tag\":\"$CI_COMMIT_TAG\",\"repository\":\"$CI_REPO\",\"sha256\":\"$SHA\",\"channel\":\"stable\"}" \
          https://codeisland.azhr.cloud/api/deploy-webhook || true
        echo "==> Production pipeline finished successfully!"
    when:
      - event: tag
