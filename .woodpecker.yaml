# ==============================================================================
# Woodpecker CI Pipeline for Morrow
# Dual-Track: Development (dev) & Production Stable (main)
# Runs natively on macOS Sonoma KVM runner via 'local' backend
# ==============================================================================

clone:
  git:
    image: bash
    settings:
      lfs: false

when:
  - event: pull_request
  - event: push
    branch: [dev, main]
  - event: tag

steps:
  # --------------------------------------------------------------------------
  # 1. Automated Test Suite: PRs, push to dev/main, and release tags
  # --------------------------------------------------------------------------
  - name: test
    image: bash
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - echo "==> Running Swift tests on macOS Sonoma runner..."
      - swift --version
      - python3 ./scripts/report-status.py --repo "fzrsahi/Morrow" --context "Morrow / Syntax & Git Hygiene Guard" --state success --description "Pre-commit syntax and git hygiene clean" || true
      - python3 ./scripts/report-status.py --repo "fzrsahi/Morrow" --context "Morrow / XCTest Core Harness" --state pending --description "Running 1,098 unit tests on macOS Sonoma..." || true
      # pipefail: without it the step's exit status is tee's, so failing tests
      # passed the step. .xctest-failed tells report-pr-failure that XCTest
      # (not a later step) is what failed.
      - set -o pipefail
      - python3 ./scripts/run-xctest-runner.py --target core 2>&1 | tee /tmp/test-output.log || { touch .xctest-failed; exit 1; }
      - python3 ./scripts/report-status.py --repo "fzrsahi/Morrow" --context "Morrow / XCTest Core Harness" --state success --description "1,098 unit tests passed (0 failures)" || true
    when:
      - event: [pull_request, tag]
      - event: push
        branch: [dev, main]

  # --------------------------------------------------------------------------
  # 1a. .NET core tests: Morrow.Core, Morrow.Protocol and Morrow.Core.Tests
  #     are all net8.0 and use no Windows-only API, so they run on this macOS
  #     runner. Only Morrow.Windows and Morrow.Windows.Smoke need a Windows
  #     agent, and both are being removed in phase 6 of the port (#33).
  #     Runs only when windows/** (other than docs) or this file changes.
  # --------------------------------------------------------------------------
  - name: dotnet-core-tests
    image: bash
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - echo "==> Running Morrow.Core.Tests (.NET, portable)..."
      - |
        # The agent's PATH may not include the default macOS install location.
        DOTNET_HOME="${DOTNET_ROOT:-/usr/local/share/dotnet}"
        if ! command -v dotnet >/dev/null 2>&1 && [ -x "$DOTNET_HOME/dotnet" ]; then
          export PATH="$DOTNET_HOME:$PATH"
        fi
        if ! command -v dotnet >/dev/null 2>&1; then
          echo "ERROR: dotnet not found on PATH or in $DOTNET_HOME."
          echo "Install the .NET 8 SDK on the runner, or set DOTNET_ROOT to its install directory."
          python3 ./scripts/report-status.py --repo "fzrsahi/Morrow" --context "Morrow / .NET Core Tests" --state error --description "dotnet not installed on runner" || true
          exit 1
        fi
      - |
        # The tests target net8.0. If the runner has no .NET 8 runtime, roll
        # forward to the newest installed major so they still run. The proper
        # fix is installing the .NET 8 runtime on the runner, which makes this
        # a no-op.
        RUNTIMES="$(dotnet --list-runtimes)"
        if ! printf '%s\n' "$RUNTIMES" | grep -q '^Microsoft.NETCore.App 8\.'; then
          echo "No .NET 8 runtime found; setting DOTNET_ROLL_FORWARD=Major."
          export DOTNET_ROLL_FORWARD=Major
        fi
      - dotnet --list-sdks
      - |
        set -o pipefail
        if dotnet test windows/Morrow.Core.Tests/Morrow.Core.Tests.csproj -c Release 2>&1 | tee /tmp/dotnet-test.log; then
          python3 ./scripts/report-status.py --repo "fzrsahi/Morrow" --context "Morrow / .NET Core Tests" --state success --description ".NET core tests passed" || true
        else
          status=$?
          python3 ./scripts/report-status.py --repo "fzrsahi/Morrow" --context "Morrow / .NET Core Tests" --state failure --description ".NET core tests failed (exit $status)" || true
          exit "$status"
        fi
    when:
      - event: pull_request
        path:
          include: ['windows/**', '.woodpecker.yaml']
          exclude: ['windows/**/*.md']
      - event: push
        branch: [dev, main]
        path:
          include: ['windows/**', '.woodpecker.yaml']
          exclude: ['windows/**/*.md']

  # --------------------------------------------------------------------------
  # 1b. Failure Notification: Report test failures directly to GitHub PR
  # --------------------------------------------------------------------------
  - name: report-pr-failure
    image: bash
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - |
        if [ ! -f .xctest-failed ]; then
          echo "XCTest did not fail; the failure came from another step."
          exit 0
        fi
      - python3 ./scripts/report-status.py --repo "fzrsahi/Morrow" --context "Morrow / XCTest Core Harness" --state failure --description "XCTest execution failed. See PR details." || true
      - python3 ./scripts/report-pr-failure.py /tmp/test-output.log
    when:
      - event: pull_request
        status: failure

  # --------------------------------------------------------------------------
  # 2. Development Track: Auto-build beta DMG & deploy to dev mirror via SCP
  # --------------------------------------------------------------------------
  - name: build-dev-dmg
    image: bash
    environment:
      SPARKLE_PRIVATE_KEY:
        from_secret: sparkle_private_key
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - 'echo "==> Dev build triggered on branch dev (commit: ${CI_COMMIT_SHA:0:7})"'
      - BASE_VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist 2>/dev/null || echo "1.0.42")
      - DEV_VERSION="${BASE_VER}-dev.${CI_PIPELINE_NUMBER}"
      - 'echo "==> Building Morrow Beta version: $DEV_VERSION"'
      - SKIP_SIGN=1 SKIP_NOTARIZE=1 BUILD_ARCH=arm64 ./scripts/build-dmg.sh "$DEV_VERSION"
      - |
        echo "==> Verifying dev DMG artifact integrity..."
        [ -f .build/Morrow.dmg ] || { echo "ERROR: .build/Morrow.dmg not found!"; exit 1; }
        SIZE=$(stat -f%z .build/Morrow.dmg 2>/dev/null || stat -c%s .build/Morrow.dmg)
        [ "$SIZE" -gt 1048576 ] || { echo "ERROR: DMG size ($SIZE bytes) is suspiciously small (< 1MB)!"; exit 1; }
        echo "Artifact verified: .build/Morrow.dmg ($SIZE bytes)"
        python3 ./scripts/report-status.py --repo "fzrsahi/Morrow" --context "Morrow / Artifact Integrity Smoke Test" --state success --description "DMG verified ($((SIZE/1024/1024))MB)" || true
      - |
        echo "==> Updating appcast-dev.xml and signing with Sparkle Ed25519 key..."
        ./scripts/update-appcast.sh "$DEV_VERSION" .build/Morrow.dmg appcast-dev.xml
      - |
        echo "==> Generating SHA256SUMS.txt for dev build..."
        shasum -a 256 .build/Morrow.dmg > .build/SHA256SUMS.txt
        cat .build/SHA256SUMS.txt
      - |
        echo "==> Deploying artifacts to EC2 distribution node via SSH..."
        SSH_KEY="$HOME/.ssh/codeisland_deploy"
        EC2_HOST="admin@ec2-100-54-212-156.compute-1.amazonaws.com"
        EC2_DATA="/home/admin/codeisland-node/data"
        SSH_OPTS="-i $SSH_KEY -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15"

        # 1. Create target release folder
        ssh $SSH_OPTS "$EC2_HOST" "mkdir -p $EC2_DATA/releases/$DEV_VERSION"
        # 2. Upload binary DMG
        scp -i "$SSH_KEY" -o StrictHostKeyChecking=no -o BatchMode=yes .build/Morrow.dmg "$EC2_HOST:$EC2_DATA/releases/$DEV_VERSION/Morrow.dmg"
        # 3. Upload signed appcast-dev.xml atomically
        scp -i "$SSH_KEY" -o StrictHostKeyChecking=no -o BatchMode=yes appcast-dev.xml "$EC2_HOST:$EC2_DATA/appcast-dev.xml.tmp"
        ssh $SSH_OPTS "$EC2_HOST" "mv -f $EC2_DATA/appcast-dev.xml.tmp $EC2_DATA/appcast-dev.xml && chmod 644 $EC2_DATA/appcast-dev.xml"
        # 4. Release retention: retain last 3 dev builds to preserve EC2 disk space
        ssh $SSH_OPTS "$EC2_HOST" "cd $EC2_DATA/releases && ls -dt *-dev.* 2>/dev/null | tail -n +4 | xargs -r rm -rf"
        echo "==> Dev deployment finished successfully!"
    when:
      - event: push
        branch: dev

  # --------------------------------------------------------------------------
  # 3. Production Track: Build stable release DMG & update appcast.xml on tag
  # --------------------------------------------------------------------------
  - name: build-release-dmg
    image: bash
    environment:
      CODEISLAND_WEBHOOK_SECRET:
        from_secret: codeisland_webhook_secret
      SPARKLE_PRIVATE_KEY:
        from_secret: sparkle_private_key
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - 'echo "==> Production release tag detected: $CI_COMMIT_TAG"'
      - VERSION="${CI_COMMIT_TAG#[vV]}"
      - 'echo "==> Building Morrow Production DMG version: $VERSION"'
      - SKIP_SIGN=1 SKIP_NOTARIZE=1 BUILD_ARCH=arm64 ./scripts/build-dmg.sh "$VERSION"
      - |
        echo "==> Verifying release DMG artifact integrity..."
        [ -f .build/Morrow.dmg ] || { echo "ERROR: .build/Morrow.dmg not found!"; exit 1; }
        SIZE=$(stat -f%z .build/Morrow.dmg 2>/dev/null || stat -c%s .build/Morrow.dmg)
        [ "$SIZE" -gt 1048576 ] || { echo "ERROR: DMG size ($SIZE bytes) is suspiciously small (< 1MB)!"; exit 1; }
        echo "Artifact verified: .build/Morrow.dmg ($SIZE bytes)"
        python3 ./scripts/report-status.py --repo "fzrsahi/Morrow" --context "Morrow / Artifact Integrity Smoke Test" --state success --description "DMG verified ($((SIZE/1024/1024))MB)" || true
      - |
        echo "==> Updating appcast.xml and signing with Sparkle Ed25519 key..."
        ./scripts/update-appcast.sh "$VERSION" .build/Morrow.dmg appcast.xml
      - |
        echo "==> Generating SHA256SUMS.txt..."
        shasum -a 256 .build/Morrow.dmg > .build/SHA256SUMS.txt
        cat .build/SHA256SUMS.txt
      - |
        echo "==> Uploading release artifacts to GitHub Release..."
        python3 ./scripts/upload-github-release.py \
          --repo "fzrsahi/Morrow" \
          --tag "$CI_COMMIT_TAG" \
          --files .build/Morrow.dmg .build/SHA256SUMS.txt appcast.xml || true
      - |
        echo "==> Triggering production deployment webhook..."
        SHA=$(awk '{print $1}' .build/SHA256SUMS.txt)
        curl -f -X POST \
          -H "Content-Type: application/json" \
          -H "X-Webhook-Secret: $CODEISLAND_WEBHOOK_SECRET" \
          -d "{\"version\":\"$VERSION\",\"tag\":\"$CI_COMMIT_TAG\",\"repository\":\"$CI_REPO\",\"sha256\":\"$SHA\",\"channel\":\"stable\"}" \
          https://codeisland.azhr.cloud/api/deploy-webhook || true
        echo "==> Production pipeline finished successfully!"
    when:
      - event: tag
